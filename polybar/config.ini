; ~/.config/polybar/config.ini
; Generated by configurator.fyi/polybar

[colors]
background = #282a36
foreground = #f8f8f2
alt = #9932cc
accent = #bd93f9
urgent = #ff5555

[bar/main]
monitor = eDP-1
width = 100%
height = 22pt
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
padding-left = 0
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.alt}
font-0 = "JetBrains Mono:size=12;3"
modules-left = workspaces
modules-center = window
modules-right = memory pulseaudio battery date
tray-position = left
tray-padding = 0
cursor-click = pointer
wm-restack = i3

[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
enable-click = true
enable-scroll = false
label-focused = %name%
label-focused-background = #44475a
label-focused-underline = #9932cc
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-padding = 1
label-urgent = %name%
label-urgent-background = #ff5555
label-urgent-padding = 1

[module/window]
type = internal/xwindow
label = %title:0:60:...%

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = "CPU "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 5
format-prefix = "MEM "
label = %used%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = muted

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = AC
label-charging = BAT %percentage%%
label-discharging =BAT  %percentage%%
label-full = BAT %percentage%%

[module/date]
type = internal/date
interval = 1
date = %I:%M %p %Y.%m.%d
date-alt = %Y-%m-%d %H:%M:%S
label = %date%

[settings]
screenchange-reload = true
pseudo-transparency = false
